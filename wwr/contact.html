<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Streamline Rafters</title>
    <meta name="description" content="Looking for an epic adventure? Get in touch with Streamline Rafters today for trip reservations, river guides, and booking assistance.">
    <meta name="author" content="Alaister Zosa">
    <link rel="stylesheet" href="styles/contact.css">
</head>
<body>
    <header>
        <img src="images/wwr.png" alt="Whitewater Rafting logo">
        <nav>
            <a class="firstborder" href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main class="contact-page">
        <div class="contact-info">
            <h1>Streamline Rafters</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@streamlinerafters.com">info@streamlinerafters.com</a>
            </address>
        </div>
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d260131.22092122104!2d124.97913149697374!3d11.407027265919336!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1791136783237!5m2!1sen!2sph" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <form>
            <div class="form-item column2">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Type your full name" required>
            </div>
            <div class="form-item column2">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Type your email" required>
            </div>
            <div class="purpose">
                <p>Message Purpose</p>
                <fieldset>
                    <input type="radio" id="inquiry" name="purpose" value="inquiry" required>
                    <label for="inquiry">General Inquiry</label>

                    <input type="radio" id="question" name="purpose" value="question" required>
                    <label for="question">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion" required>
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>
            </div>
            <div>
                <label for="message" class="message-label">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Type your message here" required></textarea>
            </div>
            <div class="column1">
                <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe">Please subscribe me to the monthly newsletter</label>
            </div>
            <button type="submit">Get in Touch!</button>
        </form>
        <section class="employees">
            <h2>We Are Here to Serve You!</h2>
            <figure>
                <img src="images/ceo.jpg" alt="CEO of Streamline Rafters, Jeremy Cruise">
                <figcaption>Jeremy Cruise, CEO</figcaption>
            </figure>
            <figure>
                <img src="images/raft-guide.jpg" alt="Raft Guide of Streamline Rafters, Erica Garrett">
                <figcaption>Erica Garrett, Raft Guide</figcaption>
            </figure>
            <figure>
                <img src="images/safety-officer.jpg" alt="Safety Officer of Streamline Rafters, Micah Perez">
                <figcaption>Micah Perez, Safety Officer</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>© 2026 ◦ Streamline Rafters ◦ Alaister Zosa</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/" target="_blank"><img src="images/facebook.png" alt="Facebook logo"></a>
            <a href="https://www.instagram.com/" target="_blank"><img src="images/instagram.png" alt="Instagram logo"></a>
            <a href="https://linkedin.com/" target="_blank"><img src="images/linkedin.png" alt="LinkedIn logo"></a>
        </nav>
    </footer>
</body>
</html>
